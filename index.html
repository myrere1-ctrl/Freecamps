<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Camps Australia — Content Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EE;
    --bg-alt:#F3ECDC;
    --card:#FFFDF8;
    --ink:#2A2822;
    --ink-soft:#655F51;
    --eucalyptus:#4C6650;
    --eucalyptus-dark:#374B3A;
    --ochre:#C17A3D;
    --ochre-soft:#EADFC7;
    --rust:#A6553A;
    --line:#E4D9BF;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* --- layout --- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex-shrink:0; background:var(--eucalyptus-dark); color:#EFEAD9;
    padding:24px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 20px 8px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:16px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ochre); display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:#2A2822;}
  .brand-text{line-height:1.15;}
  .brand-text .l1{font-size:11px; letter-spacing:.08em; opacity:.7; text-transform:uppercase;}
  .brand-text .l2{font-family:'Fraunces',serif; font-size:15px; font-weight:600;}

  .nav-group{margin-bottom:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    font-size:13.5px; color:#D9D3BF; cursor:pointer; margin-bottom:2px; transition:.15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--ochre); color:#2A2822; font-weight:600;}
  .nav-icon{width:16px; text-align:center; opacity:.9; font-size:14px;}

  .main{flex:1; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line); background:var(--bg);
    position:sticky; top:0; z-index:5;
  }
  .topbar .day{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
  .topbar h1{font-size:22px; margin:2px 0 0 0;}
  .content{padding:28px 32px 60px 32px; max-width:1280px;}

  /* route-line signature motif */
  .route-divider{
    display:flex; align-items:center; gap:8px; margin:28px 0 18px 0; color:var(--ink-soft);
  }
  .route-divider .txt{font-size:11px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;}
  .route-divider .line{flex:1; height:0; border-top:2px dotted var(--line);}

  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:600; letter-spacing:.02em;}
  .pill-eucalyptus{background:#E4EBE1; color:var(--eucalyptus-dark);}
  .pill-ochre{background:var(--ochre-soft); color:#8A5426;}
  .pill-rust{background:#F1E0D8; color:var(--rust);}

  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-bottom:6px;}
  .kpi-value{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}

  .btn{
    border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s;
  }
  .btn-primary{background:var(--eucalyptus); color:#fff;}
  .btn-primary:hover{background:var(--eucalyptus-dark);}
  .btn-ochre{background:var(--ochre); color:#2A2822;}
  .btn-ochre:hover{filter:brightness(0.95);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--bg-alt);}
  .btn-sm{padding:7px 11px; font-size:12.5px;}

  select,input,textarea{
    font-family:'Inter',sans-serif; border:1px solid var(--line); border-radius:9px;
    padding:9px 11px; font-size:13.5px; background:#fff; color:var(--ink); width:100%;
  }
  label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}

  .idea-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .idea-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 6px 0;}
  .idea-hook{font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:10px;}
  .idea-meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .idea-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .bar-label{width:110px; flex-shrink:0; color:var(--ink-soft);}
  .bar-track{flex:1; height:8px; background:var(--bg-alt); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; background:var(--eucalyptus);}
  .bar-val{width:38px; text-align:right; flex-shrink:0; color:var(--ink-soft);}

  .post-output{background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:16px; white-space:pre-wrap; font-size:14px; line-height:1.6;}
  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ochre); font-weight:700; margin-bottom:6px;}

  .status-tag{font-size:10.5px; padding:2px 8px; border-radius:6px; font-weight:600; letter-spacing:.02em;}
  .status-IDEA{background:#EFE9DA;color:#7A7156;}
  .status-DRAFT{background:#E8E0F2;color:#6B4E9C;}
  .status-READY{background:#DDEAF0;color:#2E6E86;}
  .status-SCHEDULED{background:var(--ochre-soft);color:#8A5426;}
  .status-PUBLISHED{background:#DCEBDC;color:var(--eucalyptus-dark);}

  .empty{padding:40px 20px; text-align:center; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:14px; font-size:13.5px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:var(--bg-alt);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filters select{width:auto; min-width:120px;}

  .badge-count{background:var(--ochre); color:#2A2822; font-size:10px; padding:1px 6px; border-radius:99px; margin-left:auto; font-weight:700;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;}
</style>

<body>
<div class="app">

<script>
/* =========================================================
   DATA LAYER — localStorage, seeded demo data
   ========================================================= */
const PILLARS = ["Camp Discovery","Road Trip Planning","Rules & Education","Community / UGC","Gear & Setup","Engagement"];
const STATES = ["Australia Wide","NSW","VIC","QLD","WA","SA","TAS","NT","ACT"];
const FORMATS = ["Facebook Post","Question","Poll","Carousel","Infographic","Camp Review","Educational Post","List","Map Concept","Checklist","Guide"];
const GOALS = ["Comments","Shares","Saves","Traffic","Community","Affiliate","Authority","Viral Reach"];
const WEEKLY_SCHEDULE = {
  Monday:{tag:"📍 FREE CAMP MONDAY", pillar:"Camp Discovery"},
  Tuesday:{tag:"🗺️ ROAD TRIP TUESDAY", pillar:"Road Trip Planning"},
  Wednesday:{tag:"🧠 CAMPING SCHOOL", pillar:"Rules & Education"},
  Thursday:{tag:"⚔️ CAMP BATTLE", pillar:"Engagement"},
  Friday:{tag:"🏆 MEMBER CAMP OF THE WEEK", pillar:"Community / UGC"},
  Saturday:{tag:"🚐 WEEKEND CAMP FINDER", pillar:"Community / UGC"},
  Sunday:{tag:"🇦🇺 COMMUNITY CHOICE", pillar:"Engagement"},
};

function seedIdeas(){
  return [
    {id:cid(), title:"7 Free Camps Along The Sydney → Brisbane Route", hook:"Doing the drive up to QLD? Save this before you go.", pillar:"Road Trip Planning", state:"NSW", format:"List", goal:"Saves", desc:"A curated stop-by-stop list of free/low-cost camps between Sydney and Brisbane.", cta:"Save this for your next Big Lap leg.", affiliate:"Low", evergreen:true, status:"READY", createdDaysAgo:1},
    {id:cid(), title:"Beach Camp or Bush Camp? 🏖️🌲", hook:"Team beach or team bush — no in-between.", pillar:"Engagement", state:"Australia Wide", format:"Poll", goal:"Comments", desc:"Simple either/or poll to drive comment volume.", cta:"Drop your pick below.", affiliate:"None", evergreen:true, status:"IDEA", createdDaysAgo:0},
    {id:cid(), title:"Can You Actually Sleep At A Rest Area In NSW?", hook:"This gets asked every week — here's the real answer.", pillar:"Rules & Education", state:"NSW", format:"Educational Post", goal:"Authority", desc:"Clarify rest area vs free camp rules, with a Needs Verification flag on specifics.", cta:"Bookmark this for your next trip.", affiliate:"None", evergreen:true, status:"DRAFT", createdDaysAgo:3},
    {id:cid(), title:"Member Camp Of The Week: Byron Hinterland", hook:"One of our members found this and it's too good not to share.", pillar:"Community / UGC", state:"NSW", format:"Camp Review", goal:"Community", desc:"Feature a member-submitted camp with photo + quote.", cta:"Tag someone who needs this spot.", affiliate:"None", evergreen:false, status:"IDEA", createdDaysAgo:0},
    {id:cid(), title:"Free Camps Without Power — What's Your Setup?", hook:"No power, no worries. Here's how the group handles it.", pillar:"Gear & Setup", state:"Australia Wide", format:"List", goal:"Affiliate", desc:"Round-up of common off-grid power solutions members use.", cta:"What's in your setup? Comment below.", affiliate:"High", evergreen:true, status:"IDEA", createdDaysAgo:2},
    {id:cid(), title:"Dog-Friendly Free Camps Around Dubbo", hook:"A member asked, so here's the answer.", pillar:"Camp Discovery", state:"NSW", format:"List", goal:"Saves", desc:"Sourced from a real member comment — mining opportunity.", cta:"Save this if you're travelling with a dog.", affiliate:"None", evergreen:true, status:"IDEA", createdDaysAgo:1},
  ];
}

function seedCalendar(){
  const today = new Date();
  const items = [];
  const titles = [
    "7 Free Camps Sydney → Brisbane","Beach Camp or Bush Camp?","Rest Area Rules Explained",
    "Member Camp: Byron Hinterland","Free Camps Without Power","Dog-Friendly Camps Dubbo","QLD vs WA — Which Big Lap?"
  ];
  for(let i=-2;i<=4;i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    const dayName = d.toLocaleDateString('en-AU',{weekday:'long'});
    items.push({
      id:cid(), date:d.toISOString().slice(0,10), dayName,
      title: titles[(i+2)%titles.length],
      pillar: WEEKLY_SCHEDULE[dayName]?.pillar || "Engagement",
      state: "NSW", format:"Facebook Post",
      status: i<0 ? "PUBLISHED" : (i===0 ? "READY" : "IDEA")
    });
  }
  return items;
}

function seedSeries(){
  return [
    {id:cid(), title:"Free Camps By State", steps:["NSW","QLD","VIC","SA","WA","TAS","NT","ACT"], progress:2, cadence:"Weekly"},
    {id:cid(), title:"Big Lap Stops", steps:["Sydney","Brisbane","Cairns","Darwin","Broome","Perth","Adelaide","Melbourne"], progress:1, cadence:"Fortnightly"},
  ];
}
function seedUGC(){
  return [
    {id:cid(), member:"Dave R.", camp:"Boorabbin Rest Area", state:"WA", review:"Quiet overnight stop, easy pull-in for the van, no facilities but did the job.", rating:4, status:"NEW", dateSubmitted:new Date().toISOString().slice(0,10)},
    {id:cid(), member:"Sarah & Tom", camp:"Green Lake Regional Caravan Park", state:"VIC", review:"Self-contained only but well kept, council run so rules are enforced properly.", rating:5, status:"REVIEW", dateSubmitted:new Date().toISOString().slice(0,10)},
  ];
}
function seedPerformance(){
  return [
    {id:cid(), title:"7 Free Camps Sydney → Brisbane", pillar:"Road Trip Planning", state:"NSW", format:"List", date: new Date(Date.now()-2*86400000).toISOString().slice(0,10),
      reach:4200, views:3100, likes:180, comments:64, shares:92, saves:210, linkClicks:30, newMembers:6, affiliateClicks:0, revenue:0},
    {id:cid(), title:"Beach Camp or Bush Camp?", pillar:"Engagement", state:"Australia Wide", format:"Poll", date: new Date(Date.now()-1*86400000).toISOString().slice(0,10),
      reach:6800, views:5900, likes:410, comments:312, shares:44, saves:20, linkClicks:2, newMembers:11, affiliateClicks:0, revenue:0},
  ];
}
function loadDB(){
  let db = JSON.parse(localStorage.getItem('fc_db')||'null');
  if(!db){ db = { ideas: seedIdeas(), calendar: seedCalendar(), posts: [], camps: [], campNotes: '', series: seedSeries(), ugc: seedUGC(), performance: seedPerformance() }; saveDB(db); }
  if(!db.camps) db.camps = [];
  if(db.campNotes===undefined) db.campNotes = '';
  if(!db.series) db.series = seedSeries();
  if(!db.ugc) db.ugc = seedUGC();
  if(!db.performance) db.performance = seedPerformance();
  return db;
}
function saveDB(db){ localStorage.setItem('fc_db', JSON.stringify(db)); }
function cid(){ return 'id_'+Math.random().toString(36).slice(2,10); }
let DB = loadDB();
function resetDemo(){ localStorage.removeItem('fc_db'); DB = loadDB(); render(); }

/* ---- AI settings (separate key, never bundled into exported content) ---- */
function getAISettings(){
  return JSON.parse(localStorage.getItem('fc_ai_settings')||'{"apiKey":"","model":"claude-sonnet-5"}');
}
function saveAISettings(s){ localStorage.setItem('fc_ai_settings', JSON.stringify(s)); }

/* =========================================================
   NAV
   ========================================================= */
const ROUTES = [
  {id:'command', label:'Command Center', icon:'◆'},
  {id:'ideas', label:'Idea Generator', icon:'✦'},
  {id:'studio', label:'Post Studio', icon:'✎'},
  {id:'visual', label:'Visual Studio', icon:'🖼'},
  {id:'carousel', label:'Carousel Builder', icon:'▭'},
  {id:'calendar', label:'Calendar', icon:'▤'},
  {id:'series', label:'Content Series', icon:'⟳'},
  {id:'ugc', label:'Community / UGC', icon:'🏆'},
  {id:'engagement', label:'Engagement Lab', icon:'💬'},
  {id:'library', label:'Content Library', icon:'▥'},
  {id:'analytics', label:'Analytics', icon:'📊'},
  {id:'gaps', label:'Gaps & Affiliate', icon:'⚠'},
  {id:'mining', label:'Comment Mining', icon:'⛏'},
  {id:'camps', label:'Camp Database', icon:'📍'},
  {id:'settings', label:'Settings · AI', icon:'⚙'},
];
let currentRoute = 'command';

function renderNav(){
  const el = document.getElementById('navGroup');
  el.innerHTML = ROUTES.map(r=>`
    <div class="nav-item ${r.id===currentRoute?'active':''}" onclick="goTo('${r.id}')">
      <span class="nav-icon">${r.icon}</span>${r.label}
    </div>
  `).join('');
}
function goTo(id){ currentRoute = id; render(); }

/* =========================================================
   SIMULATED AI GENERATION (prototype only — final build calls Claude API)
   ========================================================= */
const HOOK_TEMPLATES = [
  "Ever wondered {topic}? Here's what the group needs to know.",
  "This one gets asked every week: {topic}",
  "Save this before your next trip — {topic}",
  "{topic} — the honest answer.",
  "A member asked about {topic}. Here's the round-up."
];
const CTA_BY_GOAL = {
  Comments:"What's your take? Drop it in the comments.",
  Shares:"Tag someone planning this route.",
  Saves:"Save this for your next trip.",
  Traffic:"Full details are in the group files.",
  Community:"Share your own experience below.",
  Affiliate:"Link to what we use is in the comments.",
  Authority:"Bookmark this for later.",
  "Viral Reach":"Share this with your camping mates."
};

function simulateIdeas(input, count){
  const out = [];
  for(let i=0;i<count;i++){
    const topic = input.topic || `${input.pillar} in ${input.state}`;
    out.push({
      id:cid(),
      title: `${topic}${i>0?` — Part ${i+1}`:''}`,
      hook: HOOK_TEMPLATES[i%HOOK_TEMPLATES.length].replace('{topic}', topic.toLowerCase()),
      pillar: input.pillar, state: input.state, format: input.format, goal: input.goal,
      desc: `A ${input.format.toLowerCase()} covering ${topic.toLowerCase()}, written for ${input.audience || 'the group'}.`,
      cta: CTA_BY_GOAL[input.goal] || "Let us know what you think.",
      affiliate: (input.pillar==="Gear & Setup") ? "High" : (input.pillar==="Camp Discovery"?"Low":"None"),
      evergreen: input.pillar!=="Community / UGC",
      status:"IDEA", createdDaysAgo:0
    });
  }
  return out;
}

/* ---- Real Claude API call (used when an API key is saved in Settings) ---- */
async function callClaude(systemPrompt, userPrompt, maxTokens){
  const settings = getAISettings();
  if(!settings.apiKey) return null; // caller falls back to simulation
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: settings.model || 'claude-sonnet-5',
      max_tokens: maxTokens || 1500,
      system: systemPrompt,
      messages: [{role:'user', content:userPrompt}]
    })
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText.slice(0,200)}`);
  }
  const data = await res.json();
  const textBlock = data.content.find(b=>b.type==='text');
  if(data.stop_reason === 'max_tokens'){
    console.warn('Response was cut off at max_tokens — output may be truncated.');
  }
  return textBlock ? textBlock.text : null;
}

/* Robust JSON parsing: handles responses truncated mid-array by salvaging complete objects */
function parseJSONLoose(raw){
  const clean = raw.replace(/```json|```/g,'').trim();
  try{ return JSON.parse(clean); }catch(e){}
  // Truncated mid-array: try to salvage complete {...} objects from a [ ... array
  const objMatches = clean.match(/\{[^{}]*\}/g);
  if(objMatches && objMatches.length){
    const salvaged = [];
    for(const m of objMatches){
      try{ salvaged.push(JSON.parse(m)); }catch(e){ /* skip broken tail object */ }
    }
    if(salvaged.length) return salvaged;
  }
  throw new Error('Could not parse response as JSON, even after attempting repair.');
}

function campsContextBlock(){
  let block = '';
  if(DB.campNotes && DB.campNotes.trim()){
    block += `\n\nHere are raw reference notes from real camp research. Use these facts only — never invent GPS coordinates, fees, or facilities beyond what's written here. If something isn't mentioned, say "Needs Verification":\n${DB.campNotes.trim().slice(0,6000)}`;
  }
  if(DB.camps.length){
    const rows = DB.camps.slice(0,40).map(c=>`- ${c.name} (${c.state}) — GPS:${c.lat && c.lng ? `${c.lat},${c.lng}` : 'Needs Verification'}${c.cost?`, cost:${c.cost}`:''}${c.notes?`, notes:${c.notes}`:''}`).join('\n');
    block += `\n\nStructured camp entries:\n${rows}`;
  }
  return block;
}

function simulatePost(input){
  const hook = `${input.topic}? Here's what our members need to know.`;
  const body =
`We get asked about this a lot, so here's the short version.

${input.topic} — a few things worth knowing before you head out:
• Check current access and any permit requirements before you go
• Conditions can change with weather and season, always good to double check
• If you've stayed here recently, drop a comment so the info stays current

This is the kind of thing the group's good at — real, current info from people who've actually been there.`;
  const cta = CTA_BY_GOAL[input.goal] || "Have you been? Let us know below.";
  return {hook, body, cta};
}

/* =========================================================
   PAGES
   ========================================================= */
function render(){
  renderNav();
  const el = document.getElementById('content');
  const titleEl = document.getElementById('topTitle');
  const dayEl = document.getElementById('topDay');
  const now = new Date();
  dayEl.textContent = now.toLocaleDateString('en-AU',{weekday:'long', day:'numeric', month:'long'}).toUpperCase();

  if(currentRoute==='command'){ titleEl.textContent='Command Center'; el.innerHTML = pageCommand(); }
  if(currentRoute==='ideas'){ titleEl.textContent='Idea Generator'; el.innerHTML = pageIdeas(); wireIdeas(); }
  if(currentRoute==='studio'){ titleEl.textContent='Post Studio'; el.innerHTML = pageStudio(); wireStudio(); }
  if(currentRoute==='calendar'){ titleEl.textContent='Content Calendar'; el.innerHTML = pageCalendar(); }
  if(currentRoute==='library'){ titleEl.textContent='Content Library'; el.innerHTML = pageLibrary(); wireLibrary(); }
  if(currentRoute==='camps'){ titleEl.textContent='Camp Database'; el.innerHTML = pageCamps(); wireCamps(); }
  if(currentRoute==='settings'){ titleEl.textContent='Settings · AI'; el.innerHTML = pageSettings(); wireSettings(); }
  if(currentRoute==='visual'){ titleEl.textContent='Visual Studio'; el.innerHTML = pageVisual(); wireVisual(); }
  if(currentRoute==='carousel'){ titleEl.textContent='Carousel Builder'; el.innerHTML = pageCarousel(); wireCarousel(); }
  if(currentRoute==='series'){ titleEl.textContent='Content Series'; el.innerHTML = pageSeries(); wireSeries(); }
  if(currentRoute==='ugc'){ titleEl.textContent='Community / UGC'; el.innerHTML = pageUGC(); wireUGC(); }

async function doGenerateIdeas(){
  const input = {
    pillar: document.getElementById('in_pillar').value,
    state: document.getElementById('in_state').value,
    format: document.getElementById('in_format').value,
    goal: document.getElementById('in_goal').value,
    audience: document.getElementById('in_audience').value,
    topic: document.getElementById('in_topic').value,
  };
  const count = parseInt(document.getElementById('in_count').value,10);
  const box = document.getElementById('ideaResults');
  const settings = getAISettings();

  if(!settings.apiKey){
    const ideas = simulateIdeas(input, count);
    box.innerHTML = ideas.map(idea=>ideaCard(idea)).join('');
    window.__lastIdeas = ideas;
    return;
  }

  box.innerHTML = `<div class="empty">Generating ${count} ideas with Claude…</div>`;
  try{
    const sys = `You are a content strategist for an Australian Facebook group called "Free Camps Australia", for caravan/campervan/motorhome travellers. Follow these rules strictly: community-first, useful before promotional, Australian tone, never invent campsite facts (fees, GPS, facilities, rules) — flag as "Needs Verification" if unsure, avoid generic AI writing and excessive emojis. Respond ONLY with a JSON array, no preamble, no markdown fences. Each item: {"title","hook","desc","cta","affiliate","evergreen"} where affiliate is "None"|"Low"|"High" and evergreen is true/false.`;
    const usr = `Generate ${count} content ideas.\nPillar: ${input.pillar}\nState: ${input.state}\nFormat: ${input.format}\nGoal: ${input.goal}\nAudience: ${input.audience||'general group members'}\nTopic/keyword: ${input.topic||'(open)'}${campsContextBlock()}`;
    const raw = await callClaude(sys, usr, Math.min(300 + count*300, 4096));
    const parsed = parseJSONLoose(raw);
    const ideas = parsed.map(p=>({
      id:cid(), title:p.title, hook:p.hook, pillar:input.pillar, state:input.state, format:input.format,
      goal:input.goal, desc:p.desc, cta:p.cta, affiliate:p.affiliate||'None', evergreen:!!p.evergreen,
      status:'IDEA', createdDaysAgo:0
    }));
    box.innerHTML = ideas.map(idea=>ideaCard(idea)).join('');
    window.__lastIdeas = ideas;
  }catch(err){
    box.innerHTML = `<div class="empty">Couldn't reach Claude API: ${err.message}<br>Check your API key in Settings.<br><br><button class="btn btn-ghost btn-sm" onclick="doGenerateIdeasSimFallback()">Use offline simulation instead</button></div>`;
  }
}
function doGenerateIdeasSimFallback(){
  const input = {
    pillar: document.getElementById('in_pillar').value, state: document.getElementById('in_state').value,
    format: document.getElementById('in_format').value, goal: document.getElementById('in_goal').value,

  };
  const count = parseInt(document.getElementById('in_count').value,10);

function ideaCard(idea){

function escapeAttr(s){ return s.replace(/'/g,"\\'"); }
function saveIdea(id){
  const idea = (window.__lastIdeas||[]).find(i=>i.id===id);

async function revisePost(instruction){

  if(!last) return;
  const settings = getAISettings();
  const status = document.getElementById('reviseStatus');
  if(!settings.apiKey){
    if(status) status.innerHTML = `<span style="color:var(--rust);">Post variations need a Claude API key — add one in Settings · AI first.</span>`;
    return;
  }
  if(status) status.textContent = 'Revising with Claude…';
  try{
    const sys = `You revise Facebook posts for the Australian group "Free Camps Australia" (caravan/campervan/motorhome travellers). Keep all facts exactly as given — never invent GPS, fees, or facilities. Community-first tone, avoid generic AI writing and excessive emojis. Respond ONLY with JSON, no markdown fences: {"hook":"...","body":"...","cta":"..."}`;
    const usr = `Current post:\nHook: ${last.hook}\nBody: ${last.body}\nCTA: ${last.cta}\n\nInstruction: ${instruction}\n\nReturn the full revised post (hook, body, cta) applying this instruction.${campsContextBlock()}`;

  }

      card.innerHTML = `<h3 style="margin-top:0; font-size:15px;">Questions</h3><div class="empty">Couldn't reach Claude API: ${err.message}<br><button class="btn btn-ghost btn-sm" onclick="renderQuestionsFallback('${escapeAttr(category)}',${count})">Use offline simulation</button></div>`;
      return;
    }
  }
  renderQuestions(questions, category);
}
function renderQuestionsFallback(category, count){ renderQuestions(simulateQuestions(category, count), category); }
function renderQuestions(questions, category){
  const card = document.getElementById('engagementOutputCard');
  card.innerHTML = `
    <h3 style="margin-top:0; font-size:15px;">Questions (${questions.length})</h3>
    ${questions.map((q,i)=>`
      <div style="padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="font-size:13.5px;">${q}</div>
        <button class="btn btn-ghost btn-sm" onclick="addQuestionToCalendar('${escapeAttr(q)}','${category}')" style="flex-shrink:0;">Add</button>
      </div>
    `).join('')}
  `;
  window.__lastQuestions = questions;
}
function addQuestionToCalendar(title, category){
  const d = new Date();
  DB.calendar.unshift({id:cid(), date:d.toISOString().slice(0,10), dayName:d.toLocaleDateString('en-AU',{weekday:'long'}), title, pillar:'Engagement', state:'Australia Wide', format:'Question', status:'IDEA'});
  saveDB(DB); alert('Added to Calendar');
}

/* ---- Analytics / Winner Detector / Content Recycling ---- */
function winnerLabel(engagementRate){
  if(engagementRate>=20) return {label:'VIRAL', cls:'status-PUBLISHED'};
  if(engagementRate>=10) return {label:'WINNER', cls:'status-PUBLISHED'};
  if(engagementRate>=5) return {label:'GOOD', cls:'status-READY'};
  if(engagementRate>=2) return {label:'AVERAGE', cls:'status-DRAFT'};
  return {label:'LOW', cls:'status-IDEA'};
}
function computeRates(p){
  const reach = p.reach || 1;
  const engagementRate = ((p.likes+p.comments+p.shares)/reach)*100;
  const commentRate = (p.comments/reach)*100;
  const shareRate = (p.shares/reach)*100;
  const clickRate = (p.linkClicks/reach)*100;
  return {engagementRate, commentRate, shareRate, clickRate};
}
const REPURPOSE_MAP = {
  "Camp Discovery":["Carousel breakdown","State map graphic","Comparison poll","Updated seasonal version"],
  "Road Trip Planning":["Route map graphic","Reel/video script","PDF download","Multi-part state series"],
  "Rules & Education":["Infographic summary","FAQ carousel","Quiz/poll version","Pinned reference post"],
  "Community / UGC":["Quote card","Community story feature","Follow-up interview post"],
  "Gear & Setup":["Comparison carousel","Affiliate round-up post","Before/after graphic"],
  "Engagement":["Follow-up poll","Results recap post","Debate carousel"],
};
function pageAnalytics(){
  const rows = DB.performance.map(p=>({...p, rates: computeRates(p)}));
  const sorted = [...rows].sort((a,b)=>b.rates.engagementRate - a.rates.engagementRate);
  const topWinner = sorted[0];
  return `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0; font-size:15px;">Log performance for a post</h3>
      <div class="grid grid-3">
        <div class="field"><label>Title</label><input id="p_title" placeholder="Post title"></div>
        <div class="field"><label>Pillar</label><select id="p_pillar">${PILLARS.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="field"><label>State</label><select id="p_state">${STATES.map(s=>`<option>${s}</option>`).join('')}</select></div>
      </div>
      <div class="grid grid-4">
        <div class="field"><label>Reach</label><input id="p_reach" type="number" value="0"></div>
        <div class="field"><label>Likes</label><input id="p_likes" type="number" value="0"></div>
        <div class="field"><label>Comments</label><input id="p_comments" type="number" value="0"></div>
        <div class="field"><label>Shares</label><input id="p_shares" type="number" value="0"></div>
      </div>
      <div class="grid grid-4">
        <div class="field"><label>Saves</label><input id="p_saves" type="number" value="0"></div>
        <div class="field"><label>Link Clicks</label><input id="p_clicks" type="number" value="0"></div>
        <div class="field"><label>New Members</label><input id="p_newmem" type="number" value="0"></div>
        <div class="field"><label>Affiliate Clicks</label><input id="p_affclicks" type="number" value="0"></div>
      </div>
      <button class="btn btn-primary" onclick="addPerformance()">Log Post</button>
    </div>

    <div class="route-divider"><span class="txt">🔥 Top Posts</span><div class="line"></div></div>
    <div class="card" style="margin-bottom:20px;">
      <table>
        <thead><tr><th>Title</th><th>Pillar</th><th>Reach</th><th>Eng. Rate</th><th>Comments</th><th>Shares</th><th>Status</th></tr></thead>
        <tbody>
          ${sorted.map(p=>{
            const w = winnerLabel(p.rates.engagementRate);
            return `<tr>
              <td style="font-weight:600;">${p.title}</td>
              <td>${p.pillar}</td>
              <td class="mono">${p.reach.toLocaleString()}</td>
              <td class="mono">${p.rates.engagementRate.toFixed(1)}%</td>
              <td class="mono">${p.comments}</td>
              <td class="mono">${p.shares}</td>
              <td><span class="status-tag ${w.cls}">${w.label}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    ${topWinner ? `
      <div class="route-divider"><span class="txt">♻️ Repurpose This Winner</span><div class="line"></div></div>
      <div class="card">
        <div style="font-weight:600; margin-bottom:6px;">${topWinner.title}</div>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;">${topWinner.rates.engagementRate.toFixed(1)}% engagement — your best performer right now. Don't let it disappear after one post.</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${(REPURPOSE_MAP[topWinner.pillar]||['Carousel version','Updated post']).map(r=>`<span class="pill pill-ochre">${r}</span>`).join('')}
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="sendToStudio('${escapeAttr(topWinner.title)} (Updated)','${topWinner.pillar}','${topWinner.state}','Shares')">Generate Repurposed Post</button>
      </div>
    ` : ''}
  `;
}
function wireAnalytics(){}
function addPerformance(){
  const title = document.getElementById('p_title').value.trim();
  if(!title){ alert('Title is required'); return; }
  DB.performance.unshift({
    id:cid(), title, pillar: document.getElementById('p_pillar').value, state: document.getElementById('p_state').value,
    format:'Facebook Post', date: new Date().toISOString().slice(0,10),
    reach: +document.getElementById('p_reach').value||0, views:0,
    likes: +document.getElementById('p_likes').value||0, comments: +document.getElementById('p_comments').value||0,
    shares: +document.getElementById('p_shares').value||0, saves: +document.getElementById('p_saves').value||0,
    linkClicks: +document.getElementById('p_clicks').value||0, newMembers: +document.getElementById('p_newmem').value||0,
    affiliateClicks: +document.getElementById('p_affclicks').value||0, revenue:0
  });
  saveDB(DB); render();
}

/* ---- Content Gap Detector + Affiliate Opportunity Detector ---- */
const AFFILIATE_KEYWORDS = ["solar","power station","fridge","water storage","shower","navigation","internet","recovery","toilet","battery","inverter"];
function pageGaps(){
  const allItems = [...DB.ideas, ...DB.calendar];
  const stateCounts = {}; STATES.forEach(s=>stateCounts[s]=0);
  const pillarCounts = {}; PILLARS.forEach(p=>pillarCounts[p]=0);
  allItems.forEach(i=>{ if(stateCounts[i.state]!==undefined) stateCounts[i.state]++; if(pillarCounts[i.pillar]!==undefined) pillarCounts[i.pillar]++; });
  const totalPillar = Object.values(pillarCounts).reduce((a,b)=>a+b,0) || 1;
  const sortedStates = Object.entries(stateCounts).filter(([s])=>s!=='Australia Wide').sort((a,b)=>a[1]-b[1]);
  const weakestState = sortedStates[0];
  const sortedPillars = Object.entries(pillarCounts).sort((a,b)=>a[1]-b[1]);
  const weakestPillar = sortedPillars[0];
  const strongestPillar = sortedPillars[sortedPillars.length-1];

  const affiliateHits = allItems.filter(i=>{
    const text = (i.title+' '+(i.desc||'')+' '+i.pillar).toLowerCase();
    return i.pillar==='Gear & Setup' || AFFILIATE_KEYWORDS.some(k=>text.includes(k));
  });

  return `
    <div class="route-divider"><span class="txt">⚠️ Content Gap Detector</span><div class="line"></div></div>
    <div class="grid grid-2" style="margin-bottom:20px;">
      <div class="card">
        <h3 style="margin-top:0; font-size:15px;">State Coverage</h3>
        ${sortedStates.map(([s,c])=>`
          <div class="bar-row">
            <div class="bar-label">${s}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.min(c*12,100)}%; background:${s===weakestState[0]?'var(--rust)':'var(--eucalyptus)'};"></div></div>
            <div class="bar-val">${c}</div>
          </div>
        `).join('')}
        <div class="post-output" style="margin-top:12px;">⚠️ <strong>${weakestState[0]}</strong> is your most underrepresented state (${weakestState[1]} pieces of content). Consider prioritising it next.</div>
      </div>
      <div class="card">
        <h3 style="margin-top:0; font-size:15px;">Pillar Balance</h3>
        ${sortedPillars.map(([p,c])=>`
          <div class="bar-row">
            <div class="bar-label">${p}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round((c/totalPillar)*100)}%; background:${p===strongestPillar[0]?'var(--ochre)':'var(--eucalyptus)'};"></div></div>
            <div class="bar-val">${Math.round((c/totalPillar)*100)}%</div>
          </div>
        `).join('')}
        <div class="post-output" style="margin-top:12px;">${strongestPillar[0]} is ${Math.round((strongestPillar[1]/totalPillar)*100)}% of your content — balance with more <strong>${weakestPillar[0]}</strong>.</div>
      </div>
    </div>

    <div class="route-divider"><span class="txt">💰 Affiliate Opportunities</span><div class="line"></div></div>
    <div class="card">
      ${affiliateHits.length ? affiliateHits.map(i=>`
        <div style="padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div>
            <div style="font-weight:600; font-size:13.5px;">${i.title}</div>
            <div style="font-size:11.5px; color:var(--ink-soft);">${i.pillar} · ${i.state}</div>
          </div>
          <span class="pill pill-ochre">💰 Affiliate Opportunity</span>
        </div>
      `).join('') : '<div class="empty">No obvious affiliate angles detected yet in current ideas/calendar. Community trust first — this only flags natural fits like gear/setup content.</div>'}
    </div>
  `;
}

/* ---- Comment Mining ---- */
function pageMining(){
  return `
    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-top:0;">Paste Facebook comments or discussion</h3>
        <textarea id="m_input" rows="12" placeholder="Paste raw comments here, e.g.:
'Does anyone know free camps near Dubbo that allow dogs?'
'We got stuck at a rest area with no phone reception, anyone else had that?'"></textarea>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="doMineComments()">⛏ Analyse Comments</button>
      </div>
      <div class="card" id="miningOutputCard">
        <h3 style="margin-top:0; font-size:15px;">Content Opportunities</h3>
        <div class="empty">Paste comments and analyse to extract content opportunities here.</div>
      </div>
    </div>
  `;
}
function wireMining(){}
function simulateMining(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  return lines.slice(0,8).map(line=>({
    source: line.length>90? line.slice(0,90)+'…' : line,
    opportunity: `Content idea inspired by a member question`,
    suggestedTitle: `Answering: "${line.length>50?line.slice(0,50)+'…':line}"`
  }));
}
async function doMineComments(){
  const text = document.getElementById('m_input').value.trim();
  if(!text){ alert('Paste some comments first'); return; }
  const card = document.getElementById('miningOutputCard');
  const settings = getAISettings();
  let results;
  if(!settings.apiKey){
    results = simulateMining(text);
  } else {
    card.innerHTML = `<h3 style="margin-top:0; font-size:15px;">Content Opportunities</h3><div class="empty">Analysing comments with Claude…</div>`;
    try{
      const sys = `You analyse Facebook Group comments for "Free Camps Australia" and extract content opportunities: questions, problems, frequently mentioned camps, gear problems, complaints, debates, FAQ opportunities. Respond ONLY with a JSON array, no markdown fences. Each item: {"source":"short quote of the comment (paraphrased)","opportunity":"what type of opportunity this is","suggestedTitle":"a content title this could become"}`;
      const usr = text.slice(0,4000);
      const raw = await callClaude(sys, usr, 1800);
      results = parseJSONLoose(raw);
    }catch(err){
      card.innerHTML = `<h3 style="margin-top:0; font-size:15px;">Content Opportunities</h3><div class="empty">Couldn't reach Claude API: ${err.message}<br><button class="btn btn-ghost btn-sm" onclick="renderMiningFallback()">Use offline simulation</button></div>`;
      window.__miningText = text;
      return;
    }
  }
  renderMiningResults(results);
}
function renderMiningFallback(){ renderMiningResults(simulateMining(window.__miningText||'')); }
function renderMiningResults(results){
  const card = document.getElementById('miningOutputCard');
  card.innerHTML = `
    <h3 style="margin-top:0; font-size:15px;">Content Opportunities (${results.length})</h3>
    ${results.map(r=>`
      <div class="idea-card">
        <div style="font-size:12px; color:var(--ink-soft); font-style:italic; margin-bottom:6px;">"${r.source}"</div>
        <div class="idea-title" style="font-size:15px;">${r.suggestedTitle}</div>
        <div class="pill pill-rust" style="margin-bottom:8px;">${r.opportunity}</div>
        <button class="btn btn-primary btn-sm" onclick="sendToStudio('${escapeAttr(r.suggestedTitle)}','Rules & Education','Australia Wide','Authority')">Generate Post</button>
      </div>
    `).join('')}
  `;
}

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
